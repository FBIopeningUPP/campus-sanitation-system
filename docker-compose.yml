version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-bennett-campus-sanitation-secret-key-2024}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@bennett.edu.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATING_LIMIT_PER_DAY=10
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    restart: unless-stopped
